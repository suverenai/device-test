<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suveren - device test, Mac side</title>
<style>
  :root { --fg:#1b1f23; --bg:#ffffff; --acc:#145a64; }
  body { margin:0; padding:24px 16px; font:16px/1.45 -apple-system, system-ui, sans-serif; color:var(--fg); background:var(--bg); max-width:640px; }
  button { font:inherit; padding:8px 14px; border-radius:6px; border:1px solid var(--acc); background:var(--acc); color:#fff; }
  #out { margin-top:12px; font-family:ui-monospace, monospace; font-size:14px; }
</style>
</head>
<body>
<h1>Check 10: sign in on the Mac with the phone's passkey</h1>
<p>Press the button. In the window that opens, choose <b>"Use a phone or tablet"</b> (or "iPhone, iPad or Android device"), scan the code with your phone, and confirm on the phone.</p>
<button id="go">Sign in with the phone's passkey</button>
<div id="out"></div>
<script>
document.getElementById('go').onclick = async () => {
  const out = document.getElementById('out');
  try {
    const cred = await navigator.credentials.get({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rpId: location.hostname,
      userVerification: 'required', timeout: 120000 } });
    out.textContent = 'Signed in. Credential type: ' + cred.type + ', attachment: ' + (cred.authenticatorAttachment || 'unknown') + '. Now answer "Yes" on the phone for check 10.';
  } catch (e) { out.textContent = 'Did not work: ' + e.name + ' ' + e.message + '. Answer "No" on the phone for check 10.'; }
};
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suveren - device test QR</title>
<style>
  :root { --fg:#1b1f23; --bg:#ffffff; }
  body { margin:0; padding:24px 16px; font:16px/1.4 -apple-system, system-ui, sans-serif; color:var(--fg); background:var(--bg); text-align:center; }
  #qr { display:inline-block; background:#fff; padding:16px; }
  #qr img { width:min(80vw, 520px); height:auto; image-rendering:pixelated; }
</style>
</head>
<body>
<h1>Scan this with the test app on your phone</h1>
<p>Check 7: a QR code holding 400 characters, as large as the set-up code will be.</p>
<div id="qr"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
fetch('fixtures.json', { cache: 'no-store' }).then(r => r.json()).then(f => {
  const q = qrcode(0, 'M'); q.addData(f.qr_text); q.make();
  document.getElementById('qr').innerHTML = q.createImgTag(6, 0);
});
</script>
</body>
</html>
